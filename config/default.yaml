# QuantLab default configuration.
# Every tunable parameter lives here (or in config/local.yaml, which overrides it and is git-ignored).
# Secrets are NEVER stored in config — only the NAMES of environment variables that hold them.
# The effective configuration is hashed and recorded with every run/experiment for reproducibility.

project:
  name: quantlab
  market_timezone: America/New_York
  var_dir: var                    # all runtime state lives under here (git-ignored)
  db_path: var/quantlab.db
  data_dir: var/data
  log_dir: var/logs
  report_dir: var/reports
  model_dir: var/models
  # Information cutoff for a session date D = D's regular close. Anything that became available
  # after that instant is only usable for decisions on D+1 or later. Applied identically in
  # backtests and in the live paper pipeline so research and forward results are comparable.
  info_cutoff_local_time: "16:00"

safety:
  # Paper-only is enforced in code regardless of this flag. Listed here for visibility only.
  paper_only: true
  # The only broker endpoint the execution layer will ever talk to.
  allowed_broker_base_urls:
    - https://paper-api.alpaca.markets

providers:
  prices: alpaca                  # alpaca | synthetic
  corporate_actions: alpaca       # alpaca | synthetic
  reference: nasdaq_trader        # nasdaq_trader | synthetic
  fundamentals: sec_edgar         # sec_edgar | none
  events: sec_edgar               # sec_edgar | none
  news: alpaca                    # alpaca | none
  alpaca:
    key_id_env: ALPACA_PAPER_KEY_ID
    secret_env: ALPACA_PAPER_SECRET_KEY
    data_base_url: https://data.alpaca.markets
    trading_base_url: https://paper-api.alpaca.markets
    # Free Basic plan: historical SIP allowed when `end` is >= 15 min old. BUT Alpaca docs say "Paper Only"
    # accounts (e.g. non-US) are entitled to IEX data only (IEX ~2.5% of volume, history from 2020). The feed
    # actually used is recorded on every dataset; IEX volume makes dollar-volume liquidity filters unreliable.
    feed: sip
    feed_fallback: iex            # used only if SIP is refused (403); dataset is flagged feed=iex
    asof: "-"                     # pin symbol mapping for reproducibility ("-" = no rename mapping); see docs
    max_requests_per_minute: 180
  sec_edgar:
    user_agent_env: QUANTLAB_SEC_USER_AGENT
    max_requests_per_second: 8    # SEC fair-access limit is 10/s (shared with sec_form4 below: one limiter)
  house_clerk:                    # House Clerk financial disclosures (PTR index ZIP + PTR PDFs); no key
    max_requests_per_second: 1    # no documented limit: stay modest
    user_agent: "QuantLab research (personal, non-commercial)"
  nasdaq_trader:
    nasdaq_listed_url: https://www.nasdaqtrader.com/dynamic/SymDir/nasdaqlisted.txt
    other_listed_url: https://www.nasdaqtrader.com/dynamic/SymDir/otherlisted.txt
  http:
    timeout_seconds: 30
    max_retries: 4
    backoff_seconds: 2.0

history:
  start_date: "2016-01-01"

# Congress (House PTR) + insider (SEC Form 4) disclosures: CONTEXT ONLY, never scored / sized / ordered on
# (data/alt_trades.py, docs/ALT-DATA.md). Refreshed in the evening catalyst refresh, incremental and bounded.
alt_data:
  insider:
    enabled: true
    refresh_days: 5               # daily-index days re-listed each evening (already-stored accessions skipped)
    current_feed_pages: 10        # getcurrent Atom pages (100 entries each) for filings not yet in an index
    max_filings_per_run: 3000     # ~1-3k Form 4s per business day at <= 8 req/s
    max_seconds_per_run: 300
  congress:
    enabled: true
    refresh_days: 60              # PTR filing dates re-listed each evening (already-stored DocIDs skipped)
    max_filings_per_run: 60
    max_seconds_per_run: 180
  refresh_http_timeout_seconds: 20  # evening refresh only: short timeouts and one retry, so an outage cannot stall
  refresh_http_max_retries: 1
  max_consecutive_errors: 5       # this many failed filings in a row = outage: stop, report FAILED

benchmarks:
  market: SPY
  # Sector SPDR ETFs used for sector context / relative strength (price data only => PIT-safe).
  sectors:
    XLB: Materials
    XLC: Communication Services
    XLE: Energy
    XLF: Financials
    XLI: Industrials
    XLK: Information Technology
    XLP: Consumer Staples
    XLRE: Real Estate
    XLU: Utilities
    XLV: Health Care
    XLY: Consumer Discretionary

universe:
  allowed_exchanges: [NYSE, NASDAQ, NYSE_AMERICAN, NYSE_ARCA, CBOE_BZX]
  exclude_etfs: true
  exclude_test_issues: true
  exclude_preferred: true
  exclude_warrants: true
  exclude_rights: true
  exclude_units: true
  exclude_funds_trusts: true
  # Level-based filters use RAW (unadjusted) prices so reverse splits cannot leak future info.
  min_price: 5.0
  min_median_dollar_volume: 5000000   # USD, over dollar_volume_window sessions
  dollar_volume_window: 20
  min_history_sessions: 260
  max_symbols: null                   # optional cap (by liquidity) for fast research runs

costs:
  commission_per_share: 0.0
  commission_min_per_order: 0.0
  # Half-spread charged on every fill, by 20-day median dollar volume (USD). First matching tier wins.
  half_spread_bps_tiers:
    - [100000000, 2.0]
    - [20000000, 5.0]
    - [5000000, 10.0]
    - [0, 25.0]
  slippage_bps: 5.0
  # Return assumed when a held security stops trading without a known exit price (delisting bias).
  delisting_return: -0.30

execution:
  # How simulations fill a STOP (core.tradesim, via CostModel.stop_model):
  #   intraday -- a broker-held stop-market order, as the paper runner now places: a held session that
  #               OPENS through the stop exits at that open; otherwise a session whose low touches it
  #               exits at the stop. On the entry session only the low counts (the stop is placed after
  #               the opening fill; an entry that opens below its stop gets no broker stop and falls
  #               back to the close rule).
  #   close    -- the old rule: stop checked on the close, exit at the next open.
  # Changing this moves every historical stop fill: compare before/after, never switch silently.
  # It must agree with protective_stop.enabled: intraday <=> broker stops on.
  stop_model: close
  protective_stop:                # broker-held stops (execution/protective_stops.py), paper runner only
    # OFF: the pre-registered disaster-stop test (research/2026-10-01-new-data-tests, Addendum C)
    # was NO-GO. Turning it on is a decision for Harry: set enabled: true AND stop_model: intraday.
    enabled: false
    # Where the broker stop rests: this multiple of the plan's stop distance below the entry
    # reference. 1.75 = a DISASTER stop (3.5 ATR for exploration's 2-ATR stop) for crashes and runner
    # outages, while the plan stop itself stays close-based (exit next open) in the exit engine.
    # 1.0 = the broker stop AT the plan stop (re-baseline: ~10 bps/trade worse on the momentum cohort).
    # Fixed before its re-baseline, not tuned (research/2026-10-01-new-data-tests/PREREGISTRATION.md, C).
    distance: 1.75
    poll_seconds: 30              # how often the runner checks/places stops and polls resting ones
    cancel_wait_seconds: 15       # an exit waits this long for a CONFIRMED stop cancel, else it is not sent
    max_replacements_per_session: 3

backtest:
  initial_capital: 100000
  execution: next_open            # signal at close D -> fill at open D+1
  max_positions: 10
  sizing: equal_risk              # equal_risk | equal_weight
  risk_per_trade: 0.005           # fraction of equity lost if the stop is hit
  max_position_weight: 0.10
  same_bar_stop_and_target: stop_first   # conservative
  allow_short: false

validation:
  in_sample:
    start: "2016-01-01"
    end: "2021-12-31"
  walk_forward:
    train_years: 3
    test_months: 6
    step_months: 6
    embargo_sessions: 10
  holdout:
    # LOCKED. Backtests touching dates >= start are refused unless explicitly unlocked with a
    # logged reason. Every unlock is recorded permanently and shown in reports.
    start: "2025-01-01"
  bootstrap:
    n_resamples: 2000
    block_length: 20
    seed: 7
  min_trades_for_conclusion: 100

regime:
  trend_ma_sessions: 200
  momentum_sessions: 60
  vol_window_sessions: 20
  high_vol_annualized: 0.25
  breadth_ma_sessions: 50

strategies:
  momentum_trend:
    enabled: true
    version: "1.0.0"
    params: {lookback_long: 120, lookback_mid: 60, lookback_short: 20, skip_recent: 5, ma_filter: 50, min_score_pct: 0.90, hold_sessions: 40, stop_atr: 3.0}
  mean_reversion:
    enabled: true
    version: "1.0.0"
    params: {shock_sessions: 3, shock_z: -2.0, ma_sessions: 20, trend_ma: 200, extreme_z: -3.5, hold_sessions: 5, stop_atr: 2.5}
  breakout:
    enabled: true
    version: "1.0.0"
    params: {high_window: 55, contraction_window: 20, contraction_ratio: 0.75, volume_mult: 1.5, hold_sessions: 20, stop_atr: 2.0}
  pead_ear:
    enabled: true
    version: "1.0.0"
    params: {ear_window: 3, min_abs_ear_z: 1.5, min_rel_volume: 1.5, hold_sessions: 40, stop_atr: 3.0, max_days_after_event: 3}
  relative_strength:
    enabled: true
    version: "1.0.0"
    params: {lookback: 63, vs_market_min_pct: 0.80, require_sector_strength: true, hold_sessions: 30, stop_atr: 3.0}
  quality_momentum:
    enabled: true
    version: "1.0.0"
    params: {momentum_lookback: 126, skip_recent: 21, min_momentum_pct: 0.70, min_quality_pct: 0.70, hold_sessions: 60, stop_atr: 3.5}
  news_shock:
    enabled: false                # needs a news provider with PIT timestamps; research-only until then
    version: "1.0.0"
    params: {news_count_z: 2.5, min_abs_return_z: 2.0, hold_sessions: 10, stop_atr: 2.5}
  extreme_reversal:
    enabled: true
    version: "1.0.0"
    params: {extreme_return_z: -4.0, min_rel_volume: 2.0, require_no_event: false, hold_sessions: 5, stop_atr: 3.0}
  sector_rotation:
    enabled: true
    version: "1.0.0"
    params: {sector_lookback: 63, top_sectors: 3, stock_rank_pct: 0.80, hold_sessions: 40, stop_atr: 3.0}

ml:
  enabled: true
  label_horizon_sessions: 10
  target: positive_excess_return   # P(forward excess return vs SPY > 0)
  models: [logistic, random_forest, hist_gradient_boosting]
  min_train_rows: 5000
  random_seed: 11
  calibration: isotonic
  purge_sessions: 10
  embargo_sessions: 10

ai:
  enabled: false                  # AI layer runs only when true AND a provider key is present
  active_provider: mock           # mock | anthropic | openai | google
  # Compare providers on identical evidence packets (A/B). Empty = only active_provider.
  comparison_providers: []
  prompt_version: "1.0.0"
  max_candidates_per_day: 10
  daily_token_budget: 400000
  max_output_tokens: 4000
  # temperature is omitted by default: current Anthropic flagships reject temperature != 1.0 and OpenAI
  # reasoning models reject it. LLM outputs are therefore NOT reproducible; every response is persisted.
  temperature: null
  # When the AI review is UNKNOWN (disabled, failed, over budget): "allow" = quantitative layers decide
  # (AI is an optional filter), "block" = no trade without an AI verdict.
  unknown_policy: allow
  retry_limit: 2
  timeout_seconds: 90
  cache_enabled: true
  providers:
    anthropic:
      api_key_env: ANTHROPIC_API_KEY
      base_url: https://api.anthropic.com
      anthropic_version: "2023-06-01"
      models: {researcher: claude-sonnet-5, adversary: claude-sonnet-5, judge: claude-opus-5-5}
    openai:
      api_key_env: OPENAI_API_KEY
      base_url: https://api.openai.com
      models: {researcher: gpt-5.6-terra, adversary: gpt-5.6-terra, judge: gpt-6-astra}
    google:
      api_key_env: GOOGLE_API_KEY
      base_url: https://generativelanguage.googleapis.com
      models: {researcher: gemini-3.8-flash, adversary: gemini-3.8-flash, judge: gemini-3.8-flash}
  # Model knowledge cutoffs (from provider docs, verified 2026-09-24). Any AI decision about a date BEFORE the
  # model's cutoff is CONTAMINATED (the model may know the outcome) and is excluded from AI evaluation.
  knowledge_cutoffs:
    claude-opus-5-5: "2026-06-30"
    claude-fable-5-1: "2026-06-30"
    claude-sonnet-5: "2026-01-31"
    claude-haiku-4-5-20251001: "2025-02-28"
    gpt-6-astra: "2026-04-30"
    gpt-5.6-terra: "2026-02-16"
    gemini-3.8-flash: null        # not verified -> treated as UNKNOWN (contaminated until proven otherwise)
    mock-v1: null
  # USD per million tokens (input, output), verified 2026-09-24; used for cost tracking only.
  pricing_per_mtok:
    claude-opus-5-5: [4.0, 20.0]
    claude-fable-5-1: [10.0, 50.0]
    claude-sonnet-5: [2.0, 10.0]
    claude-haiku-4-5-20251001: [1.0, 5.0]
    gpt-6-astra: [10.0, 50.0]
    gpt-5.6-terra: [2.0, 12.0]
    gemini-3.8-flash: [0.75, 3.75]
    mock-v1: [0.0, 0.0]
    mock:
      models: {researcher: mock-v1, adversary: mock-v1, judge: mock-v1}

expected_value:
  # EV uses empirically estimated win-rate/payoff from each strategy's validated history (shrunk
  # toward a no-edge prior when samples are small). LLM confidence is NEVER converted into probability.
  prior_trades: 50                # strength of the no-edge prior (pseudo-trades)
  min_ev_bps_after_costs: 10

no_trade:
  max_annualized_vol: 1.20
  min_median_dollar_volume: 5000000
  earnings_blackout_sessions: 2   # avoid entering right before a known earnings date (when known)
  max_model_disagreement: 0.35
  min_strategy_trades_for_trust: 30
  block_on_unknown_pit: true

portfolio:
  max_positions: 10
  max_gross_exposure: 1.00
  max_position_weight: 0.10
  max_sector_weight: 0.30
  max_pairwise_correlation: 0.85
  correlation_window_sessions: 60
  cash_buffer: 0.05
  risk_per_trade: 0.005
  max_open_risk: 0.04             # sum over positions of (entry - stop) * qty / equity

exploration:                      # PAPER_EXPLORATION controls (simulation hygiene, NOT live-money optimisation;
                                  # N and limits are fixed, never fitted to results)
  # Approved 2026-10-01 for the forward-evidence phase. Do NOT raise beyond 5/day and 10 open
  # without evidence and explicit approval (tests/exploration/test_sanity.py enforces the ceiling).
  max_new_per_session: 5          # up to N exploratory entries per session -- only VALID candidates, never a quota
  max_open_positions: 10          # open exploratory positions (= concurrent experiments)
  max_concurrent_experiments: 10
  max_per_industry: 2             # open + pending + same-session picks per PIT SIC industry group
  max_position_pct: 0.02          # of book equity per exploratory position
  max_session_exposure_pct: 0.10  # new exploratory notional per session (5 x 2%)
  max_total_exposure_pct: 0.20    # all open exploratory positions together (10 x 2%)
  holding_sessions: 10            # time exit when hold_arms is empty
  hold_arms: [5, 10, 20]          # time-exit arms: each decision gets one by a hash of (session, symbol),
                                  # independent of score/rank, so outcomes by holding period are comparable
  stop_atr: 2.0                   # invalidation stop = decision close - 2 x ATR(14)
  min_price: 5.0                  # basic liquidity for exploration (stricter than discovery's $1)
  min_adv: 5000000                # median dollar volume (20 sessions)
  min_atr_pct: 0.0075             # skip pinned prices (daily range < 0.75%: typically a pending cash takeover)
  watched_not_traded: 10          # next-ranked eligible candidates recorded for comparison
  submit_after_et: "08:30"        # runner: revalidate + submit planned entries from this time until the order cutoff
  min_observations_to_propose: 30 # a hypothesis needs this many exploratory outcomes before a historical test
  # Market-regime RISK THROTTLE (not a ban), docs/REGIME-THROTTLE.md: when D's regime metric (SPY vs its
  # 200-session average, regime_snapshots) is below `below`, at most `max_new_per_session` new entries
  # (min with the cap above); the rest of the normal budget is WATCHED_NOT_TRADED. Missing = UNKNOWN = no
  # throttle. Not validated: pre-registered PIT evidence from 2021-23 only. Switch off: enabled: false.
  regime_throttle:
    enabled: true
    metric: market_trend_200
    below: 0.0
    max_new_per_session: 2
  # Research tracking only (exploration/tracked.py): each symbol present in the data gets a TRACKED decision
  # record every session, scored by outcomes like the others, and is NEVER traded or sized. Keep the
  # owner's list in the git-ignored config/local.yaml.
  tracked_watchlist: []

options:                          # options layer (quantlab/options, docs/OPTIONS.md). PAPER research only.
  enabled: true                   # evaluation: read indicative quotes, compare stock vs structures, record
  paper_trading: false            # OPT paper orders (limit/day, defined risk). OFF until explicitly enabled
  feed: indicative                # the only options feed this account can read (feed=opra -> HTTP 403)
  underlying_feed: iex            # spot for `options evaluate` (latest IEX trade)
  # liquidity filter: every failed rule is recorded per contract
  max_spread_pct: 0.10            # (ask - bid) / mid
  min_bid: 0.10                   # USD per share
  max_quote_age_minutes: 30       # quote older than this vs the evaluation time -> rejected (after hours: all)
  min_open_interest: 100          # applied only when OI is known (Alpaca OI is current-only, often null)
  unknown_open_interest_fails: false
  # expiry and strikes: fixed a priori, never optimised on data
  expiry_buffer_sessions: 5       # first expiry >= horizon + buffer NYSE sessions away
  max_expiry_sessions: 120
  strike_grid:
    deltas: [0.70, 0.50, 0.30]    # single legs nearest these |delta| (vendor greeks, else MODEL from mid)
    delta_tolerance: 0.10
    include_atm: true
    include_expected_move: true   # strike nearest spot x (1 +/- ATM IV x sqrt(horizon/252))
    spreads: true                 # one debit spread: long ATM / short +1 expected move
  # model assumptions (all recorded with each evaluation)
  risk_free_rate: 0.04
  exit_iv_multiplier: 1.0         # exit before expiry repriced at entry IV x this (MODEL)
  exit_at_executable_side: true   # exits charged the entry half-spread per leg
  model_fee_per_contract: 0.0     # evaluation only; the OPT ledger records only what the broker reports
  stock_round_trip_cost_bps: 10
  min_expected_pnl_per_risk: 0.0  # below this for every expression -> NO_TRADE
  min_option_advantage_per_risk: 0.10   # a structure must beat max(stock, floor) by this per $ at risk
  distribution:
    lookback_sessions: 756        # CLI default distribution: overlapping windows of the last ~3 years
    default_stop_atr: 2.0         # CLI default stop = spot -/+ 2 x ATR(14) (as exploration.stop_atr)
  paper:                          # OPT book (used only when paper_trading is true)
    allocation: 2000              # premium budget of the OPT book (USD; not a transfer at the broker)
    max_open_positions: 3
    max_contracts_per_trade: 5
    max_premium_per_trade: 500    # worst case = long leg(s) at their limit x qty x multiplier
    max_premium_total: 1500       # all open structures together (<= allocation)
    entry_mid_fraction: 0.0       # 0 = buy at the ask / sell at the bid; 1 = mid; never better than mid
    exit_mid_fraction: 0.0
    close_before_expiry_sessions: 2   # never hold into expiry (exercise would create a stock position)

risk:
  max_drawdown_pause: 0.20        # bot book drawdown beyond this => SYSTEM_PAUSED
  max_daily_orders: 20
  max_order_notional: 15000
  require_reconciliation: true

paper:
  # STRICT: only TRADE decisions of the unchanged chain (validated strategy + EV + risk) are traded.
  # EXPLORATION: additionally, a small daily budget of the best-ranked discovery/strategy candidates
  # is paper traded WITHOUT requiring proven EV, to learn forward what works (see `exploration`).
  # Both modes keep every safety control (data quality, kill switch, limits, broker/reconciliation,
  # paper-only). Exploration results never make a strategy eligible for STRICT mode.
  mode: STRICT
  bot:
    broker: sim                   # sim | alpaca_paper (run-daily/replay); `quantlab paper start` always uses alpaca_paper
    starting_cash: 100000         # sim only: the Alpaca paper runner seeds the BOT ledger from the paper account's cash
  # Persistent Alpaca PAPER runner (`quantlab paper start`). Also requires the environment variables
  # TRADING_MODE=PAPER and LIVE_TRADING=false (checked at startup; there is no live mode).
  runner:
    process_after_et: "19:05"     # process session D from this time (>= 19:00: Alpaca rejects opg orders 09:28-19:00 ET)
    open_fill_fallback: true      # an opg order expired unfilled in the opening auction -> ONE market-day order
    open_fill_fallback_until_et: "15:45"   # never chase a missed open late in the session
    open_fill_fallback_poll_seconds: 30
    catalyst_refresh: true        # daily: recent news + SEC filings + new fundamentals (best effort; never blocks trading)
    catalyst_sec_days: 10         # SEC filings window re-read each day (acceptance-time PIT; duplicates de-duplicated)
    bundle_bars_days: 900         # bars loaded per session (>= every feature / universe / exit lookback)
    order_cutoff_et: "09:25"      # last moment to submit orders for D+1's open (must be < 09:28 ET)
    tick_seconds: 2
    heartbeat_seconds: 10
    account_poll_seconds: 60
    order_poll_seconds: 60        # REST fallback to the trade_updates stream while orders are open
    broker_fresh_seconds: 300     # the broker must have answered within this window before any order
    broker_unverified_pause_seconds: 900
    keep_awake: true                # Windows: the runner holds the PC awake while it runs
    keep_display_on_in_critical_windows: true  # and the display on 08:15-10:00 ET and 19:00-20:35 ET
    stale_heartbeat_seconds: 120  # a RUNNING session without a heartbeat for this long is presumed dead
    data_retry_seconds: 900       # retry a session whose bars are not available yet
    max_job_attempts: 3
    ingest_lookback_days: 10
  human:
    broker: sim                   # human book is always simulated internally (same fill model as bot)
    starting_cash: 100000

monitoring:
  max_data_staleness_sessions: 2
  max_missing_bar_fraction: 0.02
  llm_max_error_rate: 0.25

promotion:
  min_backtest_trades: 100
  min_walk_forward_windows: 4
  min_oos_sharpe: 0.40
  max_deflated_sharpe_pvalue: 0.10
  min_shadow_sessions: 60
  min_paper_trades: 30

logging:
  level: INFO
  json_file: true

dashboard:
  host: 127.0.0.1
  port: 8765
  live_refresh_seconds: 5         # /live re-fetches itself in place at this interval (no page reload)

# Market discovery (quantlab/discovery). Research only: it ranks and explains setups; it can never
# permit, size or place a paper order. Thresholds and weights are FIXED (not fitted to results).
discovery:
  enabled: true
  lookback_sessions: 300          # feature window (every discovery feature needs <= 200 sessions)
  basic_filter:                   # broad pre-filter; the stricter research universe is applied at validation
    min_price: 1.0
    min_median_dollar_volume: 1000000
    min_history_sessions: 60
  high_rank_score: 70             # discovery score (0-100, NOT a probability) for "high-ranked"
  min_score_coverage: 0.8         # share of the 5 scored families that must be known to rank as high
  watchlist_size: 25
  near_miss_count: 15
  context_min_coverage: 0.8       # earnings/news/fundamentals/sector are context only and never scored
  news_max_age_days: 3
  outcome_horizons: [1, 3, 5, 10, 20]
  triggers:
    momentum: {min_pct_60d: 0.90, min_pct_20d: 0.95}
    relative_strength: {min_pct_63: 0.90}
    volume_activity: {min_rel_volume_1d: 3.0, min_rel_volume_5d: 2.0}
    breakout_compression: {min_rel_volume: 1.5, max_prev_contraction: 0.5, min_range_expansion: 2.0}
    mean_reversion: {max_ret_z_3d: -2.5, max_ret_z_1d: -3.0}
    earnings: {max_days_since: 3, min_abs_ear_z: 1.5, min_event_rel_volume: 2.0}
    news: {min_count_1d: 2, min_count_z: 2.5}
  catalyst:                       # catalyst discovery (research only). Fixed a priori, never optimised on outcomes
    max_days_since_earnings: 3    # post-earnings: reaction session within the last N sessions (as triggers.earnings)
    min_abs_reaction_z: 1.5       # |abnormal reaction| in units of the stock's own 60-session abnormal vol
    min_rel_volume: 2.0           # volume confirmation: dollar volume vs the mean of the prior 20 sessions
    min_abs_move_z: 1.5           # material event: |today's move| in units of trailing daily vol
    strong_industry_rank: 0.7     # industry group's 63-session return rank among groups at D
    weak_industry_rank: 0.3
    watchlist_size: 10            # market-confirmed catalyst setups added to the watchlist (after the technical 25)
    earnings_coverage_days: 400   # a symbol is an 8-K 2.02 filer if it filed one in this window; else UNKNOWN
    news_coverage_days: 90        # news covers a symbol if it has an article in this window and the feed is current
  diagnostics:
    min_discovery_rate: 0.005     # below this share of scanned symbols -> LOW_DISCOVERY_RATE warning
    max_discovery_rate: 0.5
    one_rule_share: 0.95          # >= this share of blocked setups with one identical reason -> warning
    min_feature_coverage: 0.8

# Momentum-breakout research (branch momentum-breakout). PRE-REGISTERED values:
# docs/MOMENTUM-BREAKOUT-PREREG.md section 4. Changing one = a new variant (amend the prereg first).
momentum_breakout:
  scanner:
    min_median_dollar_volume: 20000000   # raw USD, 20-session median (stricter than master's $5M)
    dollar_volume_window: 20
    regime_fast: 10                      # SPY close > SMA10 > SMA20
    regime_slow: 20
    momentum_lookback: 63
    momentum_min_pct: 0.95               # top 5% of the universe by 63-session return
    stock_rs_min_excess: 0.10            # stock 63d return - sector ETF 63d return
    impulse_lookback: 63
    impulse_min_gain: 0.30               # low -> later high leg inside 63 sessions
    consol_min_days: 3                   # 63-session high set 3..40 sessions ago
    consol_max_days: 40
    consol_min_frac_of_high: 0.85
    consol_sma: 20
    atr_fast: 5
    atr_slow: 20
    contraction_max_ratio: 0.75
    vol_fast: 5
